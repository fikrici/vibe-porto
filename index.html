<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Monitoring — kajoe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0b0e13; color: #e7e9ea; padding: 24px 16px; min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #8b98a5; font-size: 13px; margin-bottom: 20px; }
  .sub .live { color: #22c55e; }
  .section { background: #141a23; border: 1px solid #232d3a; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8b98a5; margin-bottom: 12px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #1d2530; }
  .row:last-child { border-bottom: none; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .dot.bad { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  .dot.warn { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
  .name { font-weight: 600; font-size: 15px; }
  .meta { color: #8b98a5; font-size: 12px; margin-top: 2px; }
  .tag { margin-left: auto; font-size: 12px; padding: 3px 12px; border-radius: 20px; flex-shrink: 0; }
  .tag.ok { color: #22c55e; background: rgba(34,197,94,.12); }
  .tag.bad { color: #ef4444; background: rgba(239,68,68,.12); }
  .tag.warn { color: #f59e0b; background: rgba(245,158,11,.12); }
  .bar { height: 8px; background: #232d3a; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; border-radius: 4px; background: #22c55e; transition: width .5s; }
  .bar > div.warn { background: #f59e0b; }
  .bar > div.bad { background: #ef4444; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: #1a222d; border-radius: 10px; padding: 12px; }
  .stat .v { font-size: 20px; font-weight: 700; }
  .stat .l { font-size: 12px; color: #8b98a5; margin-top: 2px; }
  .err { text-align: center; color: #8b98a5; padding: 40px 0; }
  .foot { text-align: center; color: #5b6b7a; font-size: 12px; margin-top: 16px; }
  .models { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .model-chip { font-size: 11px; background: #1a222d; border: 1px solid #232d3a; border-radius: 12px; padding: 3px 10px; color: #a8b5c2; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Monitoring</h1>
  <div class="sub"><span class="live">●</span> <span id="updated">memuat…</span> · refresh otomatis tiap menit</div>
  <div id="content"><div class="err">Memuat data…</div></div>
  <div class="foot">auto-update tiap 15 menit dari VPS</div>
</div>
<script>
var DATA_URL = "monitoring-data.json";

function dot(cls) { return '<div class="dot ' + cls + '"></div>'; }
function tag(txt, cls) { return '<div class="tag ' + cls + '">' + txt + '</div>'; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function render(d) {
  document.getElementById("updated").textContent = "update " + d.updated_at;
  var h = "";

  h += '<div class="section"><h2>Layanan</h2>';
  (d.services || []).forEach(function(s) {
    h += '<div class="row">' + dot(s.running ? "ok" : "bad") +
      '<div><div class="name">' + esc(s.name) + '</div></div>' +
      tag(s.running ? "jalan" : "mati", s.running ? "ok" : "bad") + '</div>';
  });
  h += "</div>";

  h += '<div class="section"><h2>Provider AI</h2>';
  (d.providers || []).forEach(function(p) {
    var ok = p.active && p.status === "active";
    h += '<div class="row">' + dot(ok ? "ok" : "warn") +
      '<div><div class="name">' + esc(p.name) + '</div>' +
      '<div class="meta">prioritas ' + p.priority + ' · status: ' + esc(p.status || "-") + '</div>';
    if (p.models && p.models.length) {
      h += '<div class="models">' + p.models.map(function(m){ return '<span class="model-chip">' + esc(m) + '</span>'; }).join("") + '</div>';
    }
    h += '</div>' + tag(ok ? "aktif" : "cek", ok ? "ok" : "warn") + '</div>';
  });
  var q = d.quota_signals_24h || {};
  var qTotal = (q.gemini_429 || 0) + (q.groq_413 || 0);
  h += '<div class="row">' + dot(qTotal > 0 ? "warn" : "ok") +
    '<div><div class="name">Sinyal limit 24 jam</div>' +
    '<div class="meta">Gemini 429: ' + (q.gemini_429 || 0) + ' · Groq 413: ' + (q.groq_413 || 0) + '</div></div>' +
    tag(qTotal > 0 ? qTotal + "x kena" : "bersih", qTotal > 0 ? "warn" : "ok") + '</div>';
  h += "</div>";

  var s = d.system || {};
  var ramCls = s.ram_used_pct > 90 ? "bad" : (s.ram_used_pct > 75 ? "warn" : "");
  h += '<div class="section"><h2>VPS</h2><div class="grid">';
  h += '<div class="stat"><div class="v">' + (s.ram_used_pct || "-") + '%</div><div class="l">RAM (' + (s.ram_available_mb || "-") + ' MB sisa)</div><div class="bar"><div class="' + ramCls + '" style="width:' + (s.ram_used_pct || 0) + '%"></div></div></div>';
  h += '<div class="stat"><div class="v">' + (s.disk_home_mb ? (s.disk_home_mb/1024).toFixed(1) + " GB" : "-") + '</div><div class="l">Disk home</div></div>';
  h += '<div class="stat"><div class="v">' + (s.cpu_count || "-") + ' core</div><div class="l">load ' + (s.load_1m || "-") + '</div></div>';
  h += '<div class="stat"><div class="v">' + (s.uptime_hours || "-") + ' jam</div><div class="l">uptime</div></div>';
  h += "</div></div>";

  document.getElementById("content").innerHTML = h;
}

function load() {
  fetch(DATA_URL + "?t=" + Date.now())
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(render)
    .catch(function() {
      document.getElementById("content").innerHTML = '<div class="err">Gagal memuat data. Coba refresh.</div>';
    });
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
