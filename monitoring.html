<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Monitoring — kajoe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #07090d; --card: #10141b; --card2: #161c26; --border: #1f2836; --txt: #e8edf3; --mut: #8b98a9; --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --blue: #3b82f6; --purple: #8b5cf6; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif; background: var(--bg); color: var(--txt); min-height: 100vh; }
  .hero { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); padding: 36px 20px 28px; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; top: -60px; right: -60px; width: 220px; height: 220px; background: radial-gradient(circle, rgba(139,92,246,.25), transparent 70%); border-radius: 50%; }
  .hero-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  .hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .hero h1 .ai { background: linear-gradient(90deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero .sub { color: var(--mut); font-size: 13px; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); } 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  .section { margin-bottom: 22px; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--mut); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
  .dot.bad { background: var(--red); box-shadow: 0 0 10px var(--red); }
  .dot.warn { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
  .card-name { font-weight: 700; font-size: 15px; }
  .card-sub { color: var(--mut); font-size: 12px; margin-top: 2px; }
  .card-foot { margin-top: 10px; }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: .05em; display: inline-block; }
  .badge.ok { color: var(--green); background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3); }
  .badge.bad { color: var(--red); background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); }
  .badge.warn { color: var(--amber); background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 11px; background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 4px 10px; color: #a8b5c7; font-family: monospace; }
  /* Limit cards */
  .limit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 500px) { .limit-grid { grid-template-columns: 1fr; } }
  .limit-card { border-radius: 16px; padding: 18px; border: 1px solid var(--border); position: relative; overflow: hidden; }
  .limit-card.safe { background: linear-gradient(135deg, rgba(34,197,94,.08), var(--card)); }
  .limit-card.hit { background: linear-gradient(135deg, rgba(245,158,11,.1), var(--card)); border-color: rgba(245,158,11,.35); }
  .limit-card h3 { font-size: 16px; margin-bottom: 4px; }
  .limit-card .big-status { font-size: 13px; font-weight: 700; margin: 8px 0; }
  .limit-card .detail { font-size: 12px; color: var(--mut); line-height: 1.6; }
  .limit-card .meaning { font-size: 12px; margin-top: 10px; padding: 10px; background: rgba(0,0,0,.25); border-radius: 10px; line-height: 1.5; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
  @media (min-width: 600px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
  .stat .big { font-size: 26px; font-weight: 800; }
  .stat .lbl { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }
  .usage-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:12px;}.usage-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}.usage-name{font-weight:700;font-size:14px;}.usage-pct{font-size:22px;font-weight:800;}.usage-sub{font-size:12px;color:var(--mut);margin-bottom:10px;}.usage-track{height:10px;background:var(--card2);border-radius:5px;overflow:hidden;}.usage-fill{height:100%;border-radius:5px;transition:width .5s;}
  .foot { text-align: center; color: #4b586a; font-size: 12px; margin-top: 8px; }
  .loading { text-align: center; padding: 60px 0; color: var(--mut); }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--purple); border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="hero"><div class="hero-inner">
  <h1><span class="ai">AI</span> Monitoring</h1>
  <div class="sub"><span class="pulse"></span><span id="updated">menghubungkan…</span></div>
</div></div>
<div class="wrap"><div id="content"><div class="loading"><div class="spinner"></div>Memuat data…</div></div>
<div class="foot">auto-refresh tiap menit · data diperbarui tiap 15 menit dari VPS</div></div>
<script>
var DATA_URL = "https://raw.githubusercontent.com/fikrici/vibe-porto/data/monitoring-data.json";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function limitCard(name, count, code, whatItMeans, tip){
  var hit = count > 0;
  return '<div class="limit-card '+(hit?"hit":"safe")+'"><h3>'+esc(name)+'</h3>'+
    '<div class="big-status" style="color:'+(hit?"var(--amber)":"var(--green)")+'">'+(hit?"⚠ Kena limit "+count+"x":"✅ Aman")+'</div>'+
    '<div class="detail">Kode: <b>'+code+'</b></div>'+
    '<div class="meaning">💡 '+whatItMeans+'<br><br>🔧 '+tip+'</div></div>';
}

function render(d){
  document.getElementById("updated").textContent = "live · update " + d.updated_at;
  var h = "";
  h += '<div class="section"><div class="section-title">Layanan</div><div class="cards">';
  (d.services||[]).forEach(function(s){
    h += '<div class="card"><div class="card-top"><span class="dot '+(s.running?"ok":"bad")+'"></span><div><div class="card-name">'+esc(s.name)+'</div></div></div><div class="card-foot"><span class="badge '+(s.running?"ok":"bad")+'">'+(s.running?"online":"offline")+'</span></div></div>';
  });
  h += '</div></div>';
  h += '<div class="section"><div class="section-title">Provider AI</div><div class="cards">';
  (d.providers||[]).forEach(function(p){
    var ok = p.active && p.status==="active";
    h += '<div class="card"><div class="card-top"><span class="dot '+(ok?"ok":"warn")+'"></span><div><div class="card-name">'+esc(p.name)+'</div><div class="card-sub">prioritas '+p.priority+'</div></div></div>';
    if(p.models&&p.models.length){ h += '<div class="chips">'+p.models.slice(0,4).map(function(m){return '<span class="chip">'+esc(m)+'</span>';}).join("")+'</div>'; }
    h += '<div class="card-foot"><span class="badge '+(ok?"ok":"warn")+'">'+(ok?"aktif":"periksa")+'</span></div></div>';
  });
  h += '</div></div>';

  var q=d.quota_signals_24h||{};
  h += '<div class="section"><div class="section-title">Status Limit API</div><div class="limit-grid">';
  h += limitCard("Gemini", q.gemini_429||0, "429 Quota Exceeded",
    "Google membatasi pemakaian gratis. Kalau kena ini, AI nggak bisa jawab sampai kuota reset (biasanya harian).",
    "Tunggu reset kuota, atau pakai Groq sebagai cadangan.");
  h += limitCard("Groq", q.groq_413||0, "413 Request Too Large",
    "Chat kepanjangan melebihi batas 8000 token/menit paket gratis Groq.",
    "Mulai chat baru biar konteksnya kecil lagi.");
  h += '</div></div>';

  var s=d.system||{};
  h += '<div class="section"><div class="section-title">Uptime</div><div class="cards"><div class="card"><div class="card-top"><span class="dot ok"></span><div><div class="card-name">' + (s.uptime_hours || "-") + ' jam</div><div class="card-sub">VPS uptime &middot; ' + (s.cpu_count || "-") + ' core CPU</div></div></div></div></div></div>';

  var diskPct = s.disk_home_mb ? Math.min(100, Math.round(s.disk_home_mb / 10240 * 100)) : 0;
  h += '<div class="section"><div class="section-title">Pemakaian VPS</div>';
  h += usageBar("RAM", s.ram_used_pct||0, (s.ram_available_mb||"-")+" MB sisa", s.ram_used_pct>90?"var(--red)":(s.ram_used_pct>75?"var(--amber)":"var(--green)"));
  h += usageBar("Disk", diskPct, (s.disk_home_mb?(s.disk_home_mb/1024).toFixed(1):"-")+" GB terpakai", diskPct>90?"var(--red)":(diskPct>75?"var(--amber)":"var(--blue)"));
  h += usageBar("CPU Load", Math.min(100,Math.round((s.load_1m||0)/(s.cpu_count||2)*100)), "load "+(s.load_1m||"-")+" / "+(s.cpu_count||"-")+" core", "var(--purple)");
  h += '</div>';

  document.getElementById("content").innerHTML = h;
}

function usageBar(name, pct, sub, color){
  return '<div class="usage-card"><div class="usage-top"><span class="usage-name">'+name+'</span><span class="usage-pct" style="color:'+color+'">'+pct+'%</span></div><div class="usage-sub">'+sub+'</div><div class="usage-track"><div class="usage-fill" style="width:'+Math.min(100,pct)+'%;background:'+color+'"></div></div></div>';
}

function load(){fetch(DATA_URL+"?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(render).catch(function(){document.getElementById("content").innerHTML='<div class="loading">Gagal memuat. Coba refresh.</div>';});}
load(); setInterval(load,60000);
</script>
</body>
</html>
